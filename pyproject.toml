[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends/Header in defaults is the documented idiom

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=libs --cov-report=term-missing"

[tool.coverage.report]
# The gate. It lives here, not in the Jenkinsfile, so `make test` on a laptop
# fails the same way CI does. 85 sits just under today's 90% on libs/ -- a
# ratchet: raise it as tests are added, never lower it.
fail_under = 85
