# catalog-svc schema migrations. Run from the repo root (or /app in the image):
#   python -m alembic -c services/catalog_svc/alembic.ini upgrade head
# The ArgoCD PreSync hook and the docker-compose catalog-migrate service both
# run exactly that command.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# No sqlalchemy.url here. env.py reads DATABASE_URL, the same variable the
# service reads -- a URL in this file would be a password in git.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
